# Deploys MailPilot to marketing.dauddev.com (Spaceship cPanel) over FTPS.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. server44.shared.spaceship.host
#   FTP_USERNAME  the cPanel FTP account whose home folder is the subdomain folder
#   FTP_PASSWORD  that FTP account's password
#
# Only changed files are uploaded. The server's own files are never uploaded over or
# deleted: app/config.php (database + secret keys), storage/ (sessions, logs) and install.php.
name: Deploy to marketing.dauddev.com

on:
  push:
    branches:
      - main
      - claude/dreamy-pascal-5h38pp
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: PHP syntax check
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null; done
          echo "All PHP files OK"

      - name: Diagnose FTP connection
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          echo "::group::DNS"
          getent hosts "$FTP_SERVER" || echo "Cannot resolve $FTP_SERVER"
          echo "::endgroup::"
          for port in 21 990; do
            if timeout 10 bash -c "echo > /dev/tcp/$FTP_SERVER/$port" 2>/dev/null; then echo "Port $port: OPEN"; else echo "Port $port: CLOSED/FILTERED"; fi
          done
          echo "::group::Explicit FTPS (port 21, AUTH TLS)"
          curl -sS -v --max-time 30 --ssl-reqd --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:21/" 2>&1 | grep -v '^\* \(TLS\|ALPN\)' | tail -40 && echo "RESULT: explicit FTPS works" || echo "RESULT: explicit FTPS failed"
          echo "::endgroup::"
          echo "::group::Implicit FTPS (port 990)"
          curl -sS -v --max-time 30 --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftps://$FTP_SERVER:990/" 2>&1 | tail -25 && echo "RESULT: implicit FTPS works" || echo "RESULT: implicit FTPS failed"
          echo "::endgroup::"
          echo "::group::Plain FTP (port 21)"
          curl -sS -v --max-time 30 --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:21/" 2>&1 | tail -25 && echo "RESULT: plain FTP works" || echo "RESULT: plain FTP failed"
          echo "::endgroup::"

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: loose
          timeout: 60000
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            install.php
            app/config.php
            storage/**

      - name: Check the site responds
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://marketing.dauddev.com/)
          echo "https://marketing.dauddev.com/ answered HTTP $code"
          test "$code" = "200"
